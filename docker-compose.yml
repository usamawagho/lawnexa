services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./lawnexa.db}
      SECRET_KEY: ${SECRET_KEY:-}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:5500}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-LawNexa Administrator}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
    volumes:
      - .:/app
    restart: unless-stopped
