<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LawNexa - Location-Based Legal Marketplace & Bar Network</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: { 950: '#060911', 900: '#090d16', 850: '#0d1322', 800: '#131b2e', 700: '#1e293b' },
                        sapphire: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
                        gold: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        cinzel: ['"Cinzel"', 'serif']
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Alpine.js Core -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body {
            background-color: #060911;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f1f5f9;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(13, 19, 34, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .gold-glow { box-shadow: 0 0 25px -5px rgba(245, 158, 11, 0.35); }
        .purple-glow { box-shadow: 0 0 30px -5px rgba(147, 51, 234, 0.3); }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(13, 19, 34, 0.5); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 9999px; }
        [x-cloak] { display: none !important; }
    </style>
</head>

<body x-data="lawNexaApp()" class="min-h-screen flex flex-col justify-between selection:bg-gold-500 selection:text-navy-950">

    <!-- Ambient Lighting -->
    <div class="fixed top-0 left-1/4 w-[300px] sm:w-[500px] h-[300px] sm:h-[500px] bg-sapphire-600/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="fixed bottom-0 right-1/4 w-[300px] sm:w-[600px] h-[300px] sm:h-[600px] bg-gold-500/10 rounded-full blur-[140px] pointer-events-none"></div>

    <!-- ================= 1. AUTHENTICATION SCREEN ================= -->
    <div x-show="!isLoggedIn" x-transition:enter="transition ease-out duration-300" class="min-h-screen flex items-center justify-center p-4 relative z-10 my-auto">
        <div class="glass-panel max-w-md w-full rounded-3xl p-5 sm:p-8 border border-slate-800 shadow-2xl gold-glow space-y-6">
            
            <div class="text-center space-y-2">
                <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-gradient-to-tr from-gold-600 via-amber-500 to-yellow-300 p-0.5 shadow-xl shadow-gold-500/20 mx-auto">
                    <div class="w-full h-full bg-navy-950 rounded-[14px] flex items-center justify-center text-gold-400">
                        <i class="fa-solid fa-scale-balanced text-xl sm:text-2xl"></i>
                    </div>
                </div>
                <h2 class="font-cinzel text-xl sm:text-2xl font-bold tracking-wider text-white">
                    Law<span class="text-gold-400">Nexa</span>
                </h2>
                <p class="text-[10px] sm:text-xs text-slate-400 font-medium uppercase tracking-widest">Verified Legal Marketplace & Bar Network</p>
            </div>

            <div class="flex bg-navy-950/80 p-1 rounded-2xl border border-slate-800 text-xs font-bold">
                <button @click="authTab = 'login'" 
                        class="w-1/2 py-2.5 rounded-xl transition-all text-center"
                        :class="authTab === 'login' ? 'bg-gradient-to-r from-gold-500 to-amber-600 text-navy-950 font-extrabold shadow-md' : 'text-slate-400 hover:text-white'">
                    Sign In
                </button>
                <button @click="authTab = 'register'" 
                        class="w-1/2 py-2.5 rounded-xl transition-all text-center"
                        :class="authTab === 'register' ? 'bg-gradient-to-r from-gold-500 to-amber-600 text-navy-950 font-extrabold shadow-md' : 'text-slate-400 hover:text-white'">
                    Create Account
                </button>
            </div>

            <!-- LOGIN FORM -->
            <form x-show="authTab === 'login'" @submit.prevent="handleLogin()" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">Phone Number / Email</label>
                    <input type="text" x-model="loginForm.id" required placeholder="03XX-XXXXXXX or admin@lawnexa.pk" 
                           class="w-full bg-navy-950/90 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-gold-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">Password</label>
                    <input type="password" x-model="loginForm.password" required minlength="8" placeholder="••••••••" 
                           class="w-full bg-navy-950/90 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-gold-500">
                </div>

                <button type="submit" :disabled="isLoading" class="w-full py-3 bg-gradient-to-r from-gold-500 to-amber-600 text-navy-950 font-extrabold text-xs rounded-xl shadow-lg hover:from-gold-400 transition uppercase tracking-wider disabled:opacity-50">
                    <span x-text="isLoading ? 'Authenticating...' : 'Sign In'"></span>
                </button>
            </form>

            <!-- REGISTER FORM -->
            <form x-show="authTab === 'register'" @submit.prevent="handleClientRegister()" class="space-y-3.5">
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <button type="button" @click="registerForm.role = 'client'" 
                            class="py-2 px-3 rounded-xl border text-xs font-bold flex items-center justify-center gap-2 transition"
                            :class="registerForm.role === 'client' ? 'bg-sapphire-600/20 text-sapphire-400 border-sapphire-500' : 'bg-navy-950/80 text-slate-400 border-slate-800'">
                        Client
                    </button>
                    <button type="button" @click="showLawyerRegistrationModal = true" 
                            class="py-2 px-3 rounded-xl border text-xs font-bold flex items-center justify-center gap-2 transition bg-navy-950/80 text-slate-400 border-slate-800 hover:bg-gold-500/10 hover:text-gold-400">
                        Advocate
                    </button>
                </div>

                <div class="space-y-3">
                    <input type="text" x-model="registerForm.name" required placeholder="Full Name *" class="w-full bg-navy-950/90 border border-slate-800 rounded-xl p-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-gold-500">
                    <input type="tel" x-model="registerForm.phone" pattern="^03[0-9]{9}$" required placeholder="Phone Number (03XXXXXXXXX) *" class="w-full bg-navy-950/90 border border-slate-800 rounded-xl p-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-gold-500">
                    <input type="email" x-model="registerForm.email" placeholder="Email Address (Optional)" class="w-full bg-navy-950/90 border border-slate-800 rounded-xl p-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-gold-500">
                    <input type="password" x-model="registerForm.password" required minlength="8" placeholder="Password (Min 8 chars) *" class="w-full bg-navy-950/90 border border-slate-800 rounded-xl p-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-gold-500">
                    
                    <button type="submit" :disabled="isLoading" class="w-full py-3 bg-gradient-to-r from-gold-500 to-amber-600 text-navy-950 font-extrabold text-xs rounded-xl shadow-lg hover:from-gold-400 transition uppercase tracking-wider disabled:opacity-50">
                        <span x-text="isLoading ? 'Creating Account...' : 'Register Client Account'"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ================= 2. MAIN DASHBOARD ================= -->
    <div x-show="isLoggedIn" x-cloak class="flex-1 flex flex-col justify-between">
        
        <!-- HEADER -->
        <header class="sticky top-0 z-40 glass-panel border-b border-slate-800 px-4 py-3">
            <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
                <div class="flex items-center gap-2.5 cursor-pointer" @click="activeTab = 'advocates'">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-gold-600 to-yellow-300 p-0.5 shadow-lg">
                        <div class="w-full h-full bg-navy-950 rounded-[10px] flex items-center justify-center text-gold-400">
                            <i class="fa-solid fa-scale-balanced text-base"></i>
                        </div>
                    </div>
                    <div>
                        <h1 class="font-cinzel text-lg font-bold tracking-wider text-white">Law<span class="text-gold-400">Nexa</span></h1>
                        <p class="text-[9px] uppercase font-sans font-extrabold tracking-widest text-gold-400" x-text="user.role.toUpperCase() + ' PORTAL'"></p>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <template x-if="user.role === 'admin'">
                        <span class="px-2.5 py-1 rounded-lg bg-rose-500/20 text-rose-400 font-extrabold text-xs border border-rose-500/30">SYSTEM ADMIN</span>
                    </template>
                    <template x-if="user.role === 'lawyer'">
                        <button @click="showNewPostModal = true" class="px-3 py-1.5 rounded-xl bg-sapphire-600 hover:bg-sapphire-500 text-white text-xs font-bold transition flex items-center gap-1.5 shadow-lg">
                            <i class="fa-solid fa-plus text-gold-400"></i> Post manifesto
                        </button>
                    </template>

                    <button @click="logout()" class="px-3 py-1.5 rounded-xl bg-rose-950/40 border border-rose-800 text-rose-400 text-xs font-bold hover:bg-rose-900/50 transition">
                        <i class="fa-solid fa-right-from-bracket mr-1"></i> Sign Out
                    </button>
                </div>
            </div>
        </header>

        <!-- NAVIGATION TABS -->
        <nav class="bg-navy-900/90 border-b border-slate-800 sticky top-[57px] z-30 backdrop-blur-md">
            <div class="max-w-7xl mx-auto px-4 flex items-center justify-between gap-4 py-2 overflow-x-auto custom-scrollbar">
                <div class="flex items-center space-x-2">
                    <button @click="activeTab = 'advocates'" class="px-4 py-2 rounded-xl text-xs font-semibold transition shrink-0" :class="activeTab === 'advocates' ? 'bg-gold-500 text-navy-950 font-extrabold shadow-md' : 'text-slate-400 hover:text-slate-200'">
                        👨‍⚖️ Advocates Directory
                    </button>
                    <button @click="activeTab = 'feed'; fetchPosts();" class="px-4 py-2 rounded-xl text-xs font-semibold transition shrink-0" :class="activeTab === 'feed' ? 'bg-gold-500 text-navy-950 font-extrabold shadow-md' : 'text-slate-400 hover:text-slate-200'">
                        🏛️ Bar Social Feed
                    </button>
                    <button @click="activeTab = 'bookings'; fetchMyBookings();" class="px-4 py-2 rounded-xl text-xs font-semibold transition shrink-0" :class="activeTab === 'bookings' ? 'bg-gold-500 text-navy-950 font-extrabold shadow-md' : 'text-slate-400 hover:text-slate-200'">
                        📋 Appointments <span x-text="myBookings.length" class="ml-1 px-2 py-0.5 rounded-full text-[10px] bg-slate-800 text-slate-300"></span>
                    </button>
                    <template x-if="user.role === 'admin'">
                        <button @click="activeTab = 'admin'; fetchPendingLawyers();" class="px-4 py-2 rounded-xl text-xs font-semibold transition shrink-0" :class="activeTab === 'admin' ? 'bg-rose-600 text-white font-extrabold shadow-md' : 'text-rose-400 hover:text-rose-200'">
                            🛡️ Pending Approvals
                        </button>
                    </template>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <button @click="showAiAnalyzerModal = true" class="px-3 py-1.5 rounded-xl bg-purple-900/40 border border-purple-500/40 text-purple-300 font-extrabold text-xs flex items-center gap-1.5">
                        <i class="fa-solid fa-brain text-purple-400"></i> FIR AI
                    </button>
                    <button @click="showDocGeneratorModal = true" class="px-3 py-1.5 rounded-xl bg-indigo-900/40 border border-indigo-500/40 text-gold-400 font-extrabold text-xs flex items-center gap-1.5">
                        <i class="fa-solid fa-file-signature"></i> Doc Generator
                    </button>
                </div>
            </div>
        </nav>

        <!-- MAIN CONTENT AREA -->
        <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

            <!-- TAB 1: ADVOCATES DIRECTORY & HAVERSINE SEARCH -->
            <section x-show="activeTab === 'advocates'" class="space-y-6">
                <div class="glass-panel p-4 rounded-2xl border border-slate-800 space-y-3">
                    <div class="grid grid-cols-1 sm:grid-cols-12 gap-3 items-center">
                        <div class="sm:col-span-6">
                            <input type="text" x-model="searchQuery" placeholder="Filter by Advocate Name, Specialty, or Bar..." class="w-full bg-navy-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-gold-500">
                        </div>
                        <div class="sm:col-span-3">
                            <input type="text" x-model="cityFilter" placeholder="Filter by City (e.g. Lahore)" class="w-full bg-navy-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-gold-500">
                        </div>
                        <div class="sm:col-span-3">
                            <button @click="fetchLawyers()" class="w-full py-2 bg-gradient-to-r from-gold-500 to-amber-600 text-navy-950 font-extrabold text-xs rounded-xl shadow-md">
                                <i class="fa-solid fa-location-crosshairs mr-1"></i> Nearby Search
                            </button>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <template x-for="adv in filteredAdvocates" :key="adv.id">
                        <div class="glass-panel rounded-2xl p-5 border border-slate-800 flex flex-col justify-between">
                            <div>
                                <div class="flex items-start justify-between gap-3 mb-3">
                                    <div class="relative">
                                        <img :src="adv.avatar || 'https://ui-avatars.com/api/?name=' + adv.name" class="w-14 h-14 rounded-2xl object-cover border-2 border-slate-700">
                                        <span class="absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-emerald-500 border-2 border-navy-950 rounded-full"></span>
                                    </div>
                                    <span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold bg-gold-500/20 text-gold-400 border border-gold-500/30">VERIFIED ADVOCATE</span>
                                </div>
                                <h3 class="font-cinzel text-base font-bold text-white" x-text="adv.name"></h3>
                                <p class="text-xs text-slate-400 mt-0.5" x-text="adv.specialty + ' • ' + (adv.experience || 0) + ' Yrs Exp'"></p>
                                <p class="text-[11px] text-slate-300 mt-2"><i class="fa-solid fa-building-columns text-gold-400 mr-1"></i> <span x-text="adv.bar_association || 'High Court Bar'"></span></p>
                                <p x-show="adv.distance_km !== undefined" class="text-[11px] text-emerald-400 font-bold mt-1"><i class="fa-solid fa-route mr-1"></i> <span x-text="adv.distance_km + ' km away'"></span></p>
                            </div>
                            <div class="grid grid-cols-2 gap-2 mt-4 pt-3 border-t border-slate-800">
                                <button @click="openChatModal(adv)" class="py-2 rounded-xl bg-slate-800 text-white text-xs font-bold border border-slate-700 hover:bg-slate-700">
                                    <i class="fa-solid fa-comments text-gold-400 mr-1"></i> Chat
                                </button>
                                <button @click="openBookingModal(adv)" class="py-2 rounded-xl bg-gold-500 text-navy-950 text-xs font-extrabold hover:bg-gold-400">
                                    <i class="fa-solid fa-calendar-plus mr-1"></i> Consult
                                </button>
                            </div>
                        </div>
                    </template>
                </div>
            </section>

            <!-- TAB 2: BAR SOCIAL FEED -->
            <section x-show="activeTab === 'feed'" class="space-y-6 max-w-4xl mx-auto">
                <div class="space-y-4">
                    <template x-for="post in posts" :key="post.id">
                        <article class="glass-panel rounded-2xl p-5 border border-slate-800 space-y-3">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <img :src="post.authorAvatar || 'https://ui-avatars.com/api/?name=' + post.author" class="w-10 h-10 rounded-full border border-gold-500">
                                    <div>
                                        <h4 class="text-xs font-bold text-white" x-text="post.author"></h4>
                                        <p class="text-[10px] text-slate-400" x-text="post.timestamp"></p>
                                    </div>
                                </div>
                                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-slate-800 text-gold-400 border border-slate-700" x-text="post.category"></span>
                            </div>
                            <p class="text-xs text-slate-200 leading-relaxed whitespace-pre-line" x-text="post.content"></p>
                            <div class="flex items-center justify-between pt-3 border-t border-slate-800 text-xs font-medium text-slate-400">
                                <button @click="likePost(post)" class="flex items-center gap-1.5 hover:text-rose-400">
                                    <i class="fa-solid fa-heart text-rose-500"></i> <span x-text="post.likes"></span> Likes
                                </button>
                            </div>
                        </article>
                    </template>
                </div>
            </section>

            <!-- TAB 3: APPOINTMENTS & REQUESTS -->
            <section x-show="activeTab === 'bookings'" class="space-y-4 max-w-4xl mx-auto">
                <div class="glass-panel p-6 rounded-2xl border border-slate-800 space-y-4">
                    <h2 class="font-cinzel text-base font-bold text-white">📋 Consultation Appointments</h2>
                    <div class="space-y-3">
                        <template x-for="b in myBookings" :key="b.id">
                            <div class="p-4 rounded-xl bg-navy-950 border border-slate-800 flex items-center justify-between text-xs">
                                <div>
                                    <div class="flex items-center gap-2">
                                        <span class="font-bold text-white" x-text="b.clientName + ' ➔ ' + b.lawyerName"></span>
                                        <span class="px-2 py-0.5 rounded-full text-[9px] font-extrabold uppercase" :class="b.status.toLowerCase() === 'accepted' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'" x-text="b.status"></span>
                                    </div>
                                    <p class="text-slate-400 mt-1" x-text="'Summary: ' + b.summary"></p>
                                    <p class="text-[10px] text-slate-500 mt-0.5" x-text="b.date + ' | ' + b.time"></p>
                                </div>
                                <template x-if="user.role === 'lawyer' && b.status === 'pending'">
                                    <div class="flex gap-2">
                                        <button @click="respondBooking(b.id, 'accepted')" class="px-3 py-1.5 rounded-lg bg-emerald-600 text-white font-bold text-xs">Accept</button>
                                        <button @click="respondBooking(b.id, 'declined')" class="px-3 py-1.5 rounded-lg bg-rose-600/30 text-rose-300 font-bold text-xs">Decline</button>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>
            </section>

            <!-- TAB 4: ADMIN PENDING LAWYERS APPROVAL -->
            <section x-show="activeTab === 'admin' && user.role === 'admin'" class="space-y-4 max-w-4xl mx-auto">
                <div class="glass-panel p-6 rounded-2xl border border-rose-500/40 space-y-4">
                    <h2 class="font-cinzel text-base font-bold text-rose-400">🛡️ Pending Advocate Verifications</h2>
                    <div class="space-y-3">
                        <template x-for="p in pendingLawyers" :key="p.id">
                            <div class="p-4 rounded-xl bg-navy-950 border border-slate-800 flex items-center justify-between text-xs">
                                <div>
                                    <h4 class="font-bold text-white text-sm" x-text="p.name"></h4>
                                    <p class="text-slate-400" x-text="p.specialty + ' | License: ' + p.license_number"></p>
                                    <p class="text-slate-500" x-text="p.bar_association + ' | Phone: ' + p.phone"></p>
                                </div>
                                <button @click="approveLawyer(p.id)" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold">
                                    Approve Advocate
                                </button>
                            </div>
                        </template>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- ================= MODALS ================= -->

    <!-- ADVOCATE REGISTRATION MODAL -->
    <div x-show="showLawyerRegistrationModal" x-cloak class="fixed inset-0 z-50 bg-navy-950/80 backdrop-blur-md flex items-center justify-center p-4">
        <div @click.outside="showLawyerRegistrationModal = false" class="glass-panel max-w-md w-full rounded-2xl border border-gold-500/40 p-6 space-y-4">
            <h3 class="text-gold-400 font-bold text-base">Advocate Registration</h3>
            <form @submit.prevent="handleLawyerRegister()" class="space-y-3 text-xs">
                <input type="text" x-model="lawyerRegForm.name" placeholder="Full Name *" required class="w-full bg-navy-950 border border-slate-800 rounded-xl p-2.5 text-white">
                <input type="tel" x-model="lawyerRegForm.phone" pattern="^03[0-9]{9}$" placeholder="Phone Number (03XXXXXXXXX) *" required class="w-full bg-navy-950 border border-slate-800 rounded-xl p-2.5 text-white">
                <input type="email" x-model="lawyerRegForm.email" placeholder="Email Address *" required class="w-full bg-navy-950 border border-slate-800 rounded-xl p-2.5 text-white">
                <input type="password" x-model="lawyerRegForm.password" minlength="8" placeholder="Password *" required class="w-full bg-navy-950 border border-slate-800 rounded-xl p-2.5 text-white">
                <input type="text" x-model="lawyerRegForm.license_number" placeholder="License No (e.g. LHC-88991) *" required class="w-full bg-navy-950 border border-slate-800 rounded-xl p-2.5 text-white">
                <input type="text" x-model="lawyerRegForm.bar_association" placeholder="Bar Association *" required class="w-full bg-navy-950 border border-slate-800 rounded-xl p-2.5 text-white">
                <input type="text" x-model="lawyerRegForm.specialty" placeholder="Specialty *" required class="w-full bg-navy-950 border border-slate-800 rounded-xl p-2.5 text-white">
                <input type="number" x-model="lawyerRegForm.experience_years" placeholder="Experience (Years) *" required class="w-full bg-navy-950 border border-slate-800 rounded-xl p-2.5 text-white">
                <button type="submit" :disabled="isLoading" class="w-full py-2.5 bg-gold-500 text-navy-950 font-extrabold rounded-xl uppercase">Submit Verification Application</button>
            </form>
        </div>
    </div>

    <!-- DIRECT CHAT & QUOTATION MODAL -->
    <div x-show="showChatModal" x-cloak class="fixed inset-0 z-50 bg-navy-950/80 backdrop-blur-md flex items-center justify-center p-4">
        <div @click.outside="showChatModal = false" class="glass-panel max-w-lg w-full rounded-2xl border border-gold-500/40 p-4 space-y-3 max-h-[85vh] flex flex-col justify-between">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <h4 class="text-xs font-bold text-white" x-text="activeChatAdvocate?.name || 'Direct Chat'"></h4>
                <button @click="showChatModal = false" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto space-y-2 p-2 bg-navy-950 rounded-xl max-h-[300px] text-xs custom-scrollbar">
                <template x-for="(msg, idx) in chatMessages" :key="idx">
                    <div class="flex flex-col" :class="msg.sender_id === user.id ? 'items-end' : 'items-start'">
                        <div class="max-w-[80%] px-3 py-2 rounded-xl text-xs" :class="msg.sender_id === user.id ? 'bg-gold-500 text-navy-950' : 'bg-slate-800 text-white'">
                            <p x-text="msg.message"></p>
                            <template x-if="msg.quote_amount">
                                <div class="mt-2 pt-2 border-t border-navy-950/20">
                                    <p class="font-extrabold text-xs" x-text="'Fee Quote: PKR ' + msg.quote_amount"></p>
                                    <template x-if="user.role === 'client' && msg.quote_status === 'pending'">
                                        <button @click="respondQuote(msg.id, 'accepted')" class="mt-1 px-2 py-1 bg-navy-950 text-gold-400 font-bold text-[10px] rounded-lg">Accept Quote</button>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
            <div class="space-y-2">
                <template x-if="user.role === 'lawyer'">
                    <input type="number" x-model="quoteAmount" placeholder="Optional Fee Quotation Amount (PKR)" class="w-full bg-navy-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-gold-400">
                </template>
                <div class="flex items-center gap-2">
                    <input type="text" x-model="chatInputText" @keydown.enter="sendChatMessage()" placeholder="Type message..." class="flex-1 bg-navy-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                    <button @click="sendChatMessage()" class="p-2.5 rounded-xl bg-gold-500 text-navy-950 font-extrabold"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- BOOKING MODAL -->
    <div x-show="showBookingModal" x-cloak class="fixed inset-0 z-50 bg-navy-950/80 backdrop-blur-md flex items-center justify-center p-4">
        <div @click.outside="showBookingModal = false" class="glass-panel max-w-md w-full rounded-2xl border border-slate-800 p-5 space-y-3">
            <h3 class="font-cinzel text-base font-bold text-white">Book Consultation</h3>
            <div class="space-y-3 text-xs">
                <input type="date" x-model="bookingForm.date" class="w-full bg-navy-950 border border-slate-800 rounded-xl p-2.5 text-white">
                <input type="text" x-model="bookingForm.time" placeholder="Time Slot (e.g. 11:00 AM)" class="w-full bg-navy-950 border border-slate-800 rounded-xl p-2.5 text-white">
                <textarea x-model="bookingForm.summary" rows="3" placeholder="Case Summary..." class="w-full bg-navy-950 border border-slate-800 rounded-xl p-3 text-white"></textarea>
                <button @click="confirmBooking()" class="w-full py-2.5 bg-gold-500 text-navy-950 font-extrabold rounded-xl">Confirm Request</button>
            </div>
        </div>
    </div>

    <!-- AI FIR ANALYZER MODAL -->
    <div x-show="showAiAnalyzerModal" x-cloak class="fixed inset-0 z-50 bg-navy-950/80 backdrop-blur-md flex items-center justify-center p-4">
        <div @click.outside="showAiAnalyzerModal = false" class="glass-panel max-w-xl w-full rounded-2xl border border-purple-500/40 p-5 space-y-4">
            <h3 class="font-cinzel text-base font-bold text-white"><i class="fa-solid fa-brain text-purple-400"></i> AI FIR & Bail Analyzer</h3>
            <div class="space-y-3 text-xs">
                <textarea x-model="aiAnalyzerText" rows="3" placeholder="Paste FIR text here..." class="w-full bg-navy-950 border border-slate-800 rounded-xl p-3 text-white"></textarea>
                <button @click="runAiAnalysis()" :disabled="isAnalyzing" class="w-full py-2.5 bg-purple-600 text-white font-extrabold rounded-xl">
                    <span x-text="isAnalyzing ? 'Analyzing PPC Sections...' : 'Analyze FIR Strategy'"></span>
                </button>
                <div x-show="aiResult" class="p-4 bg-navy-950 rounded-2xl border border-purple-500/30 space-y-2">
                    <p class="font-bold text-purple-300" x-text="aiResult?.bailType"></p>
                    <p class="text-slate-300 leading-relaxed" x-text="aiResult?.strategy"></p>
                    <p class="text-[10px] text-slate-500 font-bold" x-text="aiResult?.disclaimer"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- SMART DOC GENERATOR MODAL -->
    <div x-show="showDocGeneratorModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4">
        <div @click.outside="showDocGeneratorModal = false" class="glass-panel max-w-xl w-full rounded-2xl border border-indigo-500/40 p-5 space-y-4">
            <h3 class="font-cinzel text-base font-bold text-gold-400">📜 AI Legal Document Generator</h3>
            <div class="space-y-3 text-xs">
                <select x-model="docForm.type" class="w-full bg-navy-950 border border-slate-800 rounded-xl p-2.5 text-white">
                    <option value="Agreement">Rent / General Agreement</option>
                    <option value="Bail Petition">Bail Petition</option>
                    <option value="Legal Notice">Legal Notice</option>
                </select>
                <input type="text" x-model="docForm.party1" placeholder="First Party Name" class="w-full bg-navy-950 border border-slate-800 rounded-xl p-2.5 text-white">
                <input type="text" x-model="docForm.party2" placeholder="Second Party Name" class="w-full bg-navy-950 border border-slate-800 rounded-xl p-2.5 text-white">
                <textarea x-model="docForm.purpose" rows="2" placeholder="Purpose / Representation details" class="w-full bg-navy-950 border border-slate-800 rounded-xl p-2.5 text-white"></textarea>
                <button @click="generateDocument()" class="w-full py-2.5 bg-indigo-600 text-white font-extrabold rounded-xl">Generate Legal Draft</button>
                <textarea x-show="generatedDocText" x-model="generatedDocText" rows="6" class="w-full bg-navy-950 border border-slate-800 rounded-xl p-3 font-mono text-slate-300"></textarea>
            </div>
        </div>
    </div>

    <!-- FLOATING TOAST -->
    <div x-show="toast.show" x-transition class="fixed bottom-4 right-4 z-50 px-4 py-3 rounded-xl shadow-2xl border text-xs font-bold flex items-center gap-2" :class="toast.type === 'error' ? 'bg-rose-950 text-rose-300 border-rose-500' : 'bg-emerald-950 text-emerald-300 border-emerald-500'" x-cloak>
        <i class="fa-solid fa-circle-info"></i><span x-text="toast.message"></span>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://127.0.0.1:8000' 
            : window.location.origin;

        function lawNexaApp() {
            return {
                token: localStorage.getItem('access_token') || '',
                isLoggedIn: !!localStorage.getItem('access_token'),
                isLoading: false,
                authTab: 'login',
                activeTab: 'advocates',
                
                loginForm: { id: '', password: '' },
                registerForm: { role: 'client', name: '', phone: '', email: '', password: '' },
                showLawyerRegistrationModal: false,
                lawyerRegForm: { name: '', phone: '', email: '', password: '', license_number: '', bar_association: '', specialty: '', experience_years: 0 },
                
                user: JSON.parse(localStorage.getItem('user_data') || '{"id":0,"name":"Guest","role":"client"}'),
                advocates: [],
                posts: [],
                myBookings: [],
                pendingLawyers: [],
                
                searchQuery: '',
                cityFilter: '',
                
                showChatModal: false,
                activeChatAdvocate: null,
                chatMessages: [],
                chatInputText: '',
                quoteAmount: '',

                showBookingModal: false,
                selectedAdvocate: null,
                bookingForm: { date: '', time: '', summary: '' },

                showAiAnalyzerModal: false,
                isAnalyzing: false,
                aiAnalyzerText: '',
                aiResult: null,

                showDocGeneratorModal: false,
                docForm: { type: 'Agreement', party1: '', party2: '', court: 'High Court', purpose: '' },
                generatedDocText: '',

                toast: { show: false, message: '', type: 'info' },

                async init() {
                    if (this.token) {
                        await this.verifySession();
                    }
                    await this.fetchLawyers();
                },

                showToast(message, type = 'info') {
                    this.toast = { show: true, message, type };
                    setTimeout(() => { this.toast.show = false; }, 3500);
                },

                async handleLogin() {
                    this.isLoading = true;
                    const formData = new FormData();
                    formData.append('username', this.loginForm.id.trim());
                    formData.append('password', this.loginForm.password.trim());

                    try {
                        const res = await fetch(`${API_BASE}/api/v1/auth/token`, { method: 'POST', body: formData });
                        const data = await res.json();
                        if (res.ok && data.access_token) {
                            this.token = data.access_token;
                            this.user = { id: data.user_id, name: data.name, role: data.role };
                            localStorage.setItem('access_token', this.token);
                            localStorage.setItem('user_data', JSON.stringify(this.user));
                            this.isLoggedIn = true;
                            this.showToast('Login successful!', 'success');
                            if (this.user.role === 'admin') this.fetchPendingLawyers();
                        } else {
                            this.showToast(data.detail || 'Login failed.', 'error');
                        }
                    } catch (e) {
                        this.showToast('Server connection error.', 'error');
                    } finally {
                        this.isLoading = false;
                    }
                },

                async handleClientRegister() {
                    this.isLoading = true;
                    const formData = new FormData();
                    formData.append('name', this.registerForm.name);
                    formData.append('phone', this.registerForm.phone);
                    if (this.registerForm.email) formData.append('email', this.registerForm.email);
                    formData.append('password', this.registerForm.password);
                    formData.append('role', 'client');

                    try {
                        const res = await fetch(`${API_BASE}/api/v1/auth/register`, { method: 'POST', body: formData });
                        const data = await res.json();
                        if (res.ok && data.access_token) {
                            this.token = data.access_token;
                            this.user = { id: data.user_id, name: this.registerForm.name, role: 'client' };
                            localStorage.setItem('access_token', this.token);
                            localStorage.setItem('user_data', JSON.stringify(this.user));
                            this.isLoggedIn = true;
                            this.showToast('Registration successful!', 'success');
                        } else {
                            this.showToast(data.detail || 'Registration failed.', 'error');
                        }
                    } catch (e) {
                        this.showToast('Server error during registration.', 'error');
                    } finally {
                        this.isLoading = false;
                    }
                },

                async handleLawyerRegister() {
                    this.isLoading = true;
                    const formData = new FormData();
                    formData.append('name', this.lawyerRegForm.name);
                    formData.append('phone', this.lawyerRegForm.phone);
                    formData.append('email', this.lawyerRegForm.email);
                    formData.append('password', this.lawyerRegForm.password);
                    formData.append('role', 'lawyer');
                    formData.append('license_number', this.lawyerRegForm.license_number);
                    formData.append('bar_association', this.lawyerRegForm.bar_association);
                    formData.append('specialty', this.lawyerRegForm.specialty);
                    formData.append('experience_years', this.lawyerRegForm.experience_years);

                    try {
                        const res = await fetch(`${API_BASE}/api/v1/auth/register`, { method: 'POST', body: formData });
                        const data = await res.json();
                        if (res.ok) {
                            this.showLawyerRegistrationModal = false;
                            this.showToast('Advocate application submitted for Admin approval!', 'success');
                            this.authTab = 'login';
                        } else {
                            this.showToast(data.detail || 'Registration failed.', 'error');
                        }
                    } catch (e) {
                        this.showToast('Server error during application submission.', 'error');
                    } finally {
                        this.isLoading = false;
                    }
                },

                async verifySession() {
                    try {
                        const res = await fetch(`${API_BASE}/api/v1/auth/me`, {
                            headers: { 'Authorization': `Bearer ${this.token}` }
                        });
                        if (res.ok) {
                            this.user = await res.json();
                            this.isLoggedIn = true;
                        } else {
                            this.logout();
                        }
                    } catch (e) {
                        console.warn("Session check offline");
                    }
                },

                logout() {
                    localStorage.removeItem('access_token');
                    localStorage.removeItem('user_data');
                    this.token = '';
                    this.isLoggedIn = false;
                    this.user = { id: 0, name: 'Guest', role: 'client' };
                },

                async fetchLawyers() {
                    try {
                        let url = `${API_BASE}/api/v1/lawyers/nearby?client_lat=31.5204&client_lng=74.3587&radius_km=50`;
                        if (this.cityFilter) url += `&city=${encodeURIComponent(this.cityFilter)}`;
                        const res = await fetch(url);
                        if (res.ok) this.advocates = await res.json();
                    } catch (e) {
                        console.error(e);
                    }
                },

                get filteredAdvocates() {
                    return this.advocates.filter(a => {
                        const q = this.searchQuery.toLowerCase();
                        return !q || a.name.toLowerCase().includes(q) || a.specialty.toLowerCase().includes(q);
                    });
                },

                async fetchPosts() {
                    try {
                        const res = await fetch(`${API_BASE}/api/v1/posts`);
                        if (res.ok) this.posts = await res.json();
                    } catch (e) { console.error(e); }
                },

                async fetchMyBookings() {
                    try {
                        const res = await fetch(`${API_BASE}/api/v1/bookings`, {
                            headers: { 'Authorization': `Bearer ${this.token}` }
                        });
                        if (res.ok) this.myBookings = await res.json();
                    } catch (e) { console.error(e); }
                },

                async fetchPendingLawyers() {
                    try {
                        const res = await fetch(`${API_BASE}/api/v1/admin/lawyers/pending`, {
                            headers: { 'Authorization': `Bearer ${this.token}` }
                        });
                        if (res.ok) this.pendingLawyers = await res.json();
                    } catch (e) { console.error(e); }
                },

                async approveLawyer(id) {
                    try {
                        const res = await fetch(`${API_BASE}/api/v1/admin/lawyers/${id}/approve`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${this.token}` }
                        });
                        if (res.ok) {
                            this.showToast('Advocate approved!', 'success');
                            await this.fetchPendingLawyers();
                        }
                    } catch (e) { this.showToast('Approval failed.', 'error'); }
                },

                openBookingModal(adv) {
                    this.selectedAdvocate = adv;
                    this.showBookingModal = true;
                },

                async confirmBooking() {
                    try {
                        const res = await fetch(`${API_BASE}/api/v1/bookings`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.token}` },
                            body: JSON.stringify({
                                lawyer_id: this.selectedAdvocate.id,
                                date: this.bookingForm.date,
                                time: this.bookingForm.time,
                                summary: this.bookingForm.summary
                            })
                        });
                        if (res.ok) {
                            this.showBookingModal = false;
                            this.showToast('Consultation booked!', 'success');
                        }
                    } catch (e) { this.showToast('Booking failed.', 'error'); }
                },

                openChatModal(adv) {
                    this.activeChatAdvocate = adv;
                    this.showChatModal = true;
                    this.fetchChatHistory();
                },

                async fetchChatHistory() {
                    if (!this.activeChatAdvocate) return;
                    const targetId = this.activeChatAdvocate.user_id || this.activeChatAdvocate.id;
                    try {
                        const res = await fetch(`${API_BASE}/api/v1/chat/history/${targetId}`, {
                            headers: { 'Authorization': `Bearer ${this.token}` }
                        });
                        if (res.ok) this.chatMessages = await res.json();
                    } catch (e) { console.error(e); }
                },

                async sendChatMessage() {
                    if (!this.chatInputText.trim()) return;
                    const targetId = this.activeChatAdvocate.user_id || this.activeChatAdvocate.id;
                    const payload = {
                        receiver_id: targetId,
                        message: this.chatInputText.trim(),
                        quote_amount: this.quoteAmount ? parseFloat(this.quoteAmount) : null
                    };

                    try {
                        const res = await fetch(`${API_BASE}/api/v1/chat/send`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.token}` },
                            body: JSON.stringify(payload)
                        });
                        if (res.ok) {
                            this.chatInputText = '';
                            this.quoteAmount = '';
                            await this.fetchChatHistory();
                        }
                    } catch (e) { this.showToast('Failed to send message.', 'error'); }
                },

                async respondQuote(chatId, action) {
                    try {
                        const res = await fetch(`${API_BASE}/api/v1/chat/quote/${chatId}/respond?action=${action}`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${this.token}` }
                        });
                        if (res.ok) {
                            this.showToast(`Quotation ${action}!`, 'success');
                            await this.fetchChatHistory();
                        }
                    } catch (e) { this.showToast('Action failed.', 'error'); }
                },

                async runAiAnalysis() {
                    this.isAnalyzing = true;
                    const formData = new FormData();
                    formData.append('text', this.aiAnalyzerText);

                    try {
                        const res = await fetch(`${API_BASE}/api/v1/ai/analyze-fir`, { method: 'POST', body: formData });
                        if (res.ok) this.aiResult = await res.json();
                    } catch (e) { this.showToast('FIR analysis failed.', 'error'); }
                    finally { this.isAnalyzing = false; }
                },

                async generateDocument() {
                    try {
                        const res = await fetch(`${API_BASE}/api/v1/ai/generate-doc`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.docForm)
                        });
                        if (res.ok) {
                            const data = await res.json();
                            this.generatedDocText = data.draft;
                        }
                    } catch (e) { this.showToast('Document generation failed.', 'error'); }
                }
            };
        }
    </script>
</body>
</html>
